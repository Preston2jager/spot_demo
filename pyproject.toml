[project]
name = "demo-polyu"
version = "0.1.0"
description = "Boston Dynamics Spot control console — RMIT Centre for Future Construction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bosdyn-client>=5.0.1.2",
    "flask>=3.1.2",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "numpy>=2.3.4",
    "opencv-python>=4.11.0.86",
    "paramiko>=3.5",
]

[tool.ruff]
target-version = "py312"
line-length = 120
# src/ref/ 是 Boston Dynamics 示例的逐字拷贝，
# runtime/ 只有数据和日志 —— 两者都不参与 lint。
extend-exclude = ["src/ref", "runtime"]

[tool.ruff.lint]
ignore = [
    "BLE001",  # 机器人控制代码刻意用 except Exception 兜底，不能让任务中途崩掉
    "S110",    # 同上：少数纯装饰性操作失败后确实应当继续
    "DTZ005",  # 运行日志按本地时间命名和打点
    "SIM115",  # janitor.temp_audio 已用 @contextmanager 管理生命周期，误报
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
